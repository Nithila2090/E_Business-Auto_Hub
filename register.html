<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | AUTO HUB – Spare Parts &amp; Accessories</title>
  <meta name="description" content="Create an account at AUTO HUB to enjoy fast checkout, special Sri Lankan automotive spare parts discounts and order tracking.">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="images/logo/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Main Navbar -->
  <nav class="main-navbar">
    <div class="container">
      <div class="navbar-inner">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i class="fas fa-cog"></i></div>
          <div class="brand-text">
            <span class="brand-title">AUTO <span>HUB</span></span>
            <span class="brand-subtitle">SPARE PARTS &amp; ACCESSORIES</span>
          </div>
        </a>

        <a href="index.html" class="btn btn-outline-dark btn-sm">
          <i class="fas fa-arrow-left"></i> Back to Store
        </a>
      </div>
    </div>
  </nav>

  <!-- Register Form Main -->
  <main class="auth-page-wrap">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <div class="brand-icon" style="width: 52px; height: 52px; margin: 0 auto 1rem; font-size: 1.6rem;">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Sri Lanka's leading automotive spare parts network</p>
      </div>

      <form id="register-form" enctype="multipart/form-data">
        <!-- Profile Photo Upload Field -->
        <div class="form-group profile-upload-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span style="font-weight: 600;">Profile Photo</span>
            <span style="font-size: 0.78rem; font-weight: 500; color: #94a3b8;">Optional</span>
          </label>
          <div class="photo-upload-container" style="background: #f8fafc; border: 1.5px dashed #cbd5e1; border-radius: 12px; padding: 1rem 1.25rem; transition: border-color var(--transition-fast);">
            <!-- Circular Avatar Preview Box -->
            <div class="photo-preview-box" id="reg-avatar-preview-box" role="button" tabindex="0" title="Click to choose profile photo" style="width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--border-color); overflow: hidden; background: #e2e8f0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; position: relative;">
              <div id="reg-avatar-fallback" class="photo-preview-fallback" style="font-size: 2.4rem; color: #94a3b8; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
                <i class="fas fa-user"></i>
              </div>
              <img src="" alt="Profile Preview" id="reg-avatar-img" class="photo-preview-img" style="display: none; width: 100%; height: 100%; object-fit: cover;">
            </div>

            <!-- Controls & Instructions -->
            <div class="photo-upload-controls" style="flex: 1; min-width: 0;">
              <input type="file" name="profile_photo" id="reg-profile-photo" accept="image/jpeg,image/png,image/webp" style="display: none;">
              <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                <button type="button" class="btn btn-outline-dark btn-sm" id="btn-browse-photo" style="font-size: 0.82rem; padding: 0.4rem 0.85rem; border-radius: 6px;">
                  <i class="fas fa-camera"></i> <span id="btn-browse-text">Choose Photo</span>
                </button>
                <button type="button" class="btn btn-sm" id="btn-remove-photo" style="display: none; font-size: 0.82rem; padding: 0.4rem 0.85rem; border-radius: 6px; color: #e11d48; border: 1px solid #fecdd3; background: #fff5f5;">
                  <i class="fas fa-trash-alt"></i> Remove
                </button>
              </div>
              <p class="upload-help-text" style="font-size: 0.75rem; color: #64748b; margin: 0.4rem 0 0; line-height: 1.4;">
                <i class="fas fa-info-circle"></i> Supported: <strong>JPG, PNG, WEBP</strong> (Max 2MB).
              </p>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <div style="position: relative;">
            <input type="text" class="form-control" id="reg-name" required placeholder="e.g. Kasun Jayasuriya" style="padding-left: 2.5rem;">
            <i class="fas fa-user text-muted" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <div style="position: relative;">
            <input type="email" class="form-control" id="reg-email" required placeholder="name@example.com" style="padding-left: 2.5rem;">
            <i class="fas fa-envelope text-muted" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Number *</label>
          <div style="position: relative;">
            <input type="tel" class="form-control" id="reg-phone" required placeholder="070 727 5599" style="padding-left: 2.5rem;">
            <i class="fas fa-phone-alt text-muted" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);"></i>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Password *</label>
            <input type="password" class="form-control" id="reg-password" required placeholder="Min 8 characters">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password *</label>
            <input type="password" class="form-control" id="reg-confirm-password" required placeholder="Re-enter password">
          </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label class="filter-checkbox-label">
            <input type="checkbox" id="terms-check" required checked>
            <span>I agree to AUTO HUB's <a href="#" class="text-red">Terms &amp; Conditions</a> and <a href="#" class="text-red">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1.5rem;">
          <i class="fas fa-check-circle"></i> Create Account
        </button>
      </form>

      <div style="text-align: center; font-size: 0.9rem; color: #64748b; padding-top: 1rem; border-top: 1px solid #f1f5f9;">
        Already have an account? <a href="login.html" class="text-red fw-bold">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/script.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('register-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const pw = document.getElementById('reg-password').value;
        const confirmPw = document.getElementById('reg-confirm-password').value;

        if (pw !== confirmPw) {
          Store.showToast('Passwords do not match. Please check again.', 'error');
          return;
        }

        Store.showToast(`Account successfully created for <strong>${name}</strong>! Redirecting to login...`, 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      });

      // Profile Photo Preview & Reset Handlers
      const fileInput = document.getElementById('reg-profile-photo');
      const btnBrowse = document.getElementById('btn-browse-photo');
      const btnBrowseText = document.getElementById('btn-browse-text');
      const btnRemove = document.getElementById('btn-remove-photo');
      const previewImg = document.getElementById('reg-avatar-img');
      const previewFallback = document.getElementById('reg-avatar-fallback');
      const previewBox = document.getElementById('reg-avatar-preview-box');

      if (fileInput && btnBrowse) {
        btnBrowse.addEventListener('click', () => fileInput.click());
        previewBox.addEventListener('click', () => fileInput.click());
        previewBox.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            fileInput.click();
          }
        });

        fileInput.addEventListener('change', () => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) return;

          const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
          if (!validTypes.includes(file.type)) {
            Store.showToast('Please select a valid image file (JPG, PNG, or WEBP).', 'error');
            resetPhoto();
            return;
          }

          if (file.size > 2 * 1024 * 1024) {
            Store.showToast('Image size exceeds 2MB limit. Please choose a smaller image.', 'error');
            resetPhoto();
            return;
          }

          const reader = new FileReader();
          reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewImg.style.display = 'block';
            previewFallback.style.display = 'none';
            btnBrowseText.textContent = 'Change Photo';
            btnRemove.style.display = 'inline-flex';
          };
          reader.readAsDataURL(file);
        });

        btnRemove.addEventListener('click', resetPhoto);

        function resetPhoto() {
          fileInput.value = '';
          previewImg.src = '';
          previewImg.style.display = 'none';
          previewFallback.style.display = 'flex';
          btnBrowseText.textContent = 'Choose Photo';
          btnRemove.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
