</head>

  <!-- Login Form Main -->
  <main class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-wrap">
          <i class="fas fa-user-circle"></i>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage your orders, vehicle fitment, and account</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="auth-input-wrap">
            <input type="email" class="form-control" id="login-email" required placeholder="name@example.com" autocomplete="email">
            <i class="fas fa-envelope input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="forgot-password.php" class="text-red" style="font-size: 0.82rem; font-weight: 600;" id="link-forgot-pw">Forgot Password?</a>
          </div>
          <div class="auth-input-wrap">
            <input type="password" class="form-control" id="login-password" required placeholder="Enter your password" autocomplete="current-password" style="padding-right: 2.75rem;">
            <i class="fas fa-lock input-icon"></i>
            <button type="button" class="auth-toggle-pw" aria-label="Toggle password visibility">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-options-row">
          <label class="filter-checkbox-label" style="font-size: 0.85rem; color: var(--text-body); cursor: pointer;">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember my session</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-sign-in-alt"></i> Sign In to Account
        </button>
      </form>

      <div class="auth-footer">
        Don't have an AUTO HUB account? <a href="register.html">Create Free Account</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/script.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pwToggle = document.querySelector('.auth-toggle-pw');
      const pwInput = document.getElementById('login-password');
      if (pwToggle && pwInput) {
        pwToggle.addEventListener('click', () => {
          const isPassword = pwInput.type === 'password';
          pwInput.type = isPassword ? 'text' : 'password';
          const icon = pwToggle.querySelector('i');
          if (icon) {
            icon.className = isPassword ? 'far fa-eye-slash' : 'far fa-eye';
          }
        });
      }

      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        Store.showToast(`Welcome back! Logging in...`, 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      });
    });
  </script>
</body>
